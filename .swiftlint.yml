# Legacy violations are frozen in the baseline (issue #146, step 2).
# Any NEW violation fails CI (`--strict`). After fixing legacy violations,
# regenerate with: swiftlint lint --quiet --write-baseline .swiftlint-baseline.json
# Note: length/complexity entries embed their count in the match key, so if CI
# reports a baselined length/complexity violation as "new" after your change
# (even when shrinking the span), regenerate the baseline in your PR.
baseline: .swiftlint-baseline.json

included:
  - DictusApp
  - DictusKeyboard
  - DictusCore/Sources
  - DictusWidgets

excluded:
  - build
  - .build
  - Library
  - scripts
  - designs
  - DictusCore/.build
  - DictusKeyboard/Vendored      # vendored giellakbd-ios — keep as-is (see CLAUDE.md)
  - "**/*.generated.swift"

disabled_rules:
  - line_length
  - trailing_whitespace
  - todo
  - identifier_name
  - type_name

opt_in_rules:
  - empty_count
  - empty_string
  - first_where
  - last_where
  - explicit_init
  - closure_spacing
  - contains_over_first_not_nil
  - redundant_nil_coalescing
  - sorted_first_last
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - yoda_condition
  - force_unwrapping

force_cast: warning
force_try: warning

force_unwrapping:
  severity: warning

# Length and complexity thresholds (issue #146).
#
# WHY these numbers: they are set above the largest offender that exists today,
# with modest headroom, rather than below it. The thresholds inherited from #145
# were sized to flag code that was already written and was never going to be
# rewritten to meet them -- the five worst offenders (LiveActivityManager,
# KeyboardViewController, KeyboardState, TextPredictionEngine, DictationCoordinator)
# are also the five files with the worst regression history in this repo, four of
# them in or feeding the keyboard extension that nothing in CI ever executes.
# Restructuring them for a style property with no runtime consequence is the
# highest-risk change available here.
#
# So these rules stop pretending to police the code that exists and do the only
# job they can honestly do: catch a NEW type or function ballooning.
#
# Measured maxima at the time of writing, and the headroom each gets:
#   type_body_length      558  LiveActivityManager              -> 650  (+16%)
#   function_body_length  127  TextPredictionEngine.spellCheck  -> 150  (+18%)
#   file_length           686  DictationCoordinator             -> 800  (+17%)
#   cyclomatic_complexity  18  AccentExpander                   ->  20  (+2 branches)
#
# cyclomatic_complexity gets proportionally less headroom on purpose: it counts
# branches, not lines, so a single added `if` is a far bigger relative step than
# a handful of added lines.
cyclomatic_complexity:
  warning: 20
  error: 30

function_body_length:
  warning: 150
  error: 250

type_body_length:
  warning: 650
  error: 900

file_length:
  warning: 800
  error: 1200
  ignore_comment_only_lines: true

reporter: "xcode"
